    <div class="nav-container">
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="menu.html">Menu</a></li>

        <div class="nav-logo">

            <li><a href="catering.html">Catering</a></li>

<section class="contact-section">
    <h2 class="contact-title">Get in Touch</h2>
    <div class="contact-grid">
        <div class="contact-card">
            <h3>Visit Us</h3>
            <p>123 Garden Lane, Green Valley</p>
            <p>Open Daily: 11:00 AM - 10:00 PM</p>
            <br>
            <p><strong>Phone:</strong>9000730352</p>
            <br>
            <p><strong>Email:</strong> hello@oota.com</p>
        </div>

        <div class="contact-card">
            <h3>Send a Message</h3>
            <form action="#" class="catering-form">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <label for="message">Message</label>
                <textarea id="message" name="message" required></textarea>
                <button type="submit" class="submit-btn" style="margin-top: 20px;">Send Message</button>
            </form>
        </div>
    </div>
</section>

<footer class="footer">
